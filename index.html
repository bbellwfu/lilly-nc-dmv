<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="robots" content="noindex,nofollow"/>
<title>NC DMV Practice</title>
<style>
:root {
  --bg:#0f1419; --card:#1a2332; --text:#f2f5f8; --muted:#9aa7b5;
  --ok:#1f8a5b; --bad:#b83a3a; --accent:#3d8bfd; --line:#2a3545;
  --dock-h:0px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  height:100dvh; max-height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
}
header {
  flex:0 0 auto;
  padding:10px 14px 8px;
  padding-top:max(10px, env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:rgba(15,20,25,.98); z-index:5;
}
h1 { font-size:16px; margin:0 0 6px; font-weight:650; }
.nav { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
.nav button, .row button, .choice, .primary, .ghost, .dock button {
  border:0; border-radius:14px; padding:12px; font-size:15px; font-weight:650;
  cursor:pointer; color:var(--text); background:var(--card);
}
.nav button.active { background:var(--accent); }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row button { flex:1; min-width:84px; padding:9px 10px; font-size:13px; }
.row button.active { outline:2px solid var(--accent); }
.bar { margin-top:6px; height:5px; background:var(--line); border-radius:99px; overflow:hidden; }
.bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }

#shell { flex:1; min-height:0; display:flex; flex-direction:column; max-width:560px; width:100%; margin:0 auto; }
#scroll {
  flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch;
  padding:10px 14px 12px;
}
.stats { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:8px; }
.stats b { color:var(--text); }
.card {
  background:var(--card); border-radius:16px; padding:14px 14px;
  display:flex; flex-direction:column; gap:10px;
  border:1px solid #334155;
}
.card.question {
  background:#243044;
  border:1px solid #4b6fa8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.qnum { color:#8eb6ff; font-size:11px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; }
.q { font-size:17px; line-height:1.3; font-weight:600; }
.ans { font-size:15px; line-height:1.35; color:#b8f0d0; }
.expl { font-size:13px; line-height:1.4; color:var(--muted); }
.choices { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.choice {
  text-align:left; line-height:1.3; padding:12px 12px 12px 12px; font-size:15px;
  background:#121821; border:1.5px solid #3d4f66; color:var(--text);
  display:flex; gap:10px; align-items:flex-start;
}
.choice .letter {
  flex:0 0 auto; width:24px; height:24px; border-radius:8px;
  background:#2a3a50; color:#c9d7ea; font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.choice .txt { flex:1; min-width:0; }
.choice.correct { background:var(--ok); border-color:var(--ok); }
.choice.correct .letter { background:rgba(0,0,0,.2); color:#fff; }
.choice.wrong { background:var(--bad); border-color:var(--bad); opacity:.95; }
.choice.wrong .letter { background:rgba(0,0,0,.2); color:#fff; }
.choice:disabled { cursor:default; }
.primary { width:100%; background:var(--accent); min-height:48px; font-size:16px; }
.empty { background:var(--card); border-radius:16px; padding:20px; text-align:center; color:var(--muted); }
.home { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
.home .big {
  background:var(--card); border:0; border-radius:16px; padding:18px 14px; text-align:left;
  color:var(--text); cursor:pointer;
}
.home .big strong { display:block; font-size:18px; margin-bottom:4px; }
.home .big span { color:var(--muted); font-size:13px; line-height:1.35; }
.back {
  background:transparent; border:0; color:var(--accent); font-size:14px; font-weight:650;
  padding:0 0 6px; cursor:pointer; align-self:flex-start;
}
.scoreline { font-size:13px; color:var(--muted); }

/* Sticky action dock — always on screen, no scroll needed */
#dock {
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:rgba(15,20,25,.98);
  padding:10px 14px;
  padding-bottom:max(10px, env(safe-area-inset-bottom));
  display:none;
}
#dock.show { display:block; }
#dock .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#dock .actions button, #dock .primary {
  min-height:50px; padding:14px 12px; font-size:16px; font-weight:700; border-radius:14px;
}
#dock .know { background:var(--ok); }
#dock .miss { background:var(--bad); }
#dock .hint { font-size:12px; color:var(--muted); margin:0 0 8px; line-height:1.35; }
footer.tiny { display:none; }
</style>
</head>
<body>
<header>
  <h1>NC DMV Practice</h1>
  <div id="topNav" class="nav" hidden>
    <button type="button" id="tabFlash" class="active">Flashcards</button>
    <button type="button" id="tabGame">Game</button>
  </div>
  <div id="subNav" class="row" hidden>
    <button type="button" id="filterAll" class="active">All</button>
    <button type="button" id="filterMiss">Missed</button>
    <button type="button" id="clearMiss">Clear misses</button>
  </div>
  <div class="bar" id="barWrap" hidden><i id="prog"></i></div>
</header>
<div id="shell">
  <div id="scroll"></div>
  <div id="dock"></div>
</div>
<script>
const CARDS = [{"n": 1, "q": "If you refuse to take a chemical test when requested by an officer, the Division of Motor Vehicles will:", "a": "Revoke your driver license.", "expl": "Refusal to perform a chemical test will result in the immediate revocation of your driver license for at least 30 days and an additional revocation of at least 12 months by the DMV.", "choices": ["Revoke your driver license.", "Increase your insurance rates automatically.", "Require you to retake the written test.", "Issue a warning ticket only."]}, {"n": 2, "q": "If it has not previously been suspended, your license will be suspended for accumulating ____ within a three-year period.", "a": "12 points", "expl": "If you are convicted of certain motor vehicle violations in North Carolina, points are placed against your driving record. If your license has not been previously suspended and you accumulate 12 points within a three-year period, your license may be suspended for 60 days.", "choices": ["15 points", "8 points", "10 points", "12 points"]}, {"n": 3, "q": "If it has been previously suspended and reinstated, your license will be suspended for accumulating ____ points within a three-year period.", "a": "Eight", "expl": "If you are convicted of certain motor vehicle violations in North Carolina, points will be placed against your driving record. Accumulating eight points against a previously- suspended license will again result in suspension. A second suspension will last for six months and a third will last for 12 months.", "choices": ["Four", "Twelve", "Six", "Eight"]}, {"n": 4, "q": "When may you text while driving?", "a": "Under no circumstances.", "expl": "Texting while driving in North Carolina is prohibited. Using a cellular telephone while driving is a major distraction to the operator of a motor vehicle.", "choices": ["Only if using a hands-free device.", "Under no circumstances.", "Only in an emergency.", "Only when stopped at a red light."]}, {"n": 5, "q": "Who is required to wear a seat belt in a moving vehicle?", "a": "All of the vehicle's occupants", "expl": "In North Carolina, the driver and all passengers in a motor vehicle manufactured with seat belts must have the seat belts properly fastened at all times when the vehicle is in forward motion on a street or highway. Under the seat belt law, all occupants must wear seat belts, even if the vehicle is equipped with airbags.", "choices": ["Only front-seat passengers", "Only passengers under age 16", "Only the driver", "All of the vehicle's occupants"]}, {"n": 6, "q": "When approaching a school bus that is stopped on the opposite side of a divided highway, drivers:", "a": "May continue driving.", "expl": "When passing a school bus that is stopped on the opposite side of a divided highway, drivers may continue driving. If the highway is not separated by a median or divider, drivers on both sides of the street must stop.", "choices": ["Must sound their horn before continuing.", "Must come to a complete stop.", "Must slow to 10 mph.", "May continue driving."]}, {"n": 7, "q": "When approaching a school bus that is stopped on the opposite side of a center turning lane on a three-lane roadway, drivers:", "a": "Must come to a complete stop.", "expl": "When approaching a school bus that is stopped on the opposite side of a center turning lane on a three-lane roadway, drivers must come to a complete stop. Drivers may proceed when the stop arm is lifted and the lights have stopped flashing.", "choices": ["Must stop only if children are crossing.", "May continue driving.", "Must slow to 15 mph.", "Must come to a complete stop."]}, {"n": 8, "q": "When passing an emergency vehicle stopped on the side of the road, drivers should:", "a": "Vacate the lane closest to the emergency vehicle or slow down.", "expl": "If you are driving past an emergency vehicle parked on the side of the road, you must vacate the lane closest to the stationary emergency vehicle. If you cannot move over safely, you must slow down.", "choices": ["Vacate the lane closest to the emergency vehicle or slow down.", "Honk to alert the emergency workers.", "Speed up to get past the emergency vehicle quickly.", "Stop in the lane next to the emergency vehicle."]}, {"n": 9, "q": "Unless otherwise posted, the speed limit outside of cities and towns is:", "a": "55 mph.", "expl": "Unless otherwise posted, the speed limit outside of cities and towns is 55 mph. If a different speed limit is posted, you should follow that speed limit.", "choices": ["35 mph.", "65 mph.", "45 mph.", "55 mph."]}, {"n": 10, "q": "Unless otherwise posted, the speed limit on interstates is:", "a": "70 mph.", "expl": "Unless otherwise posted, the speed limit on interstates is 70 mph. If a different speed limit is posted, you should follow that speed limit.", "choices": ["55 mph.", "65 mph.", "60 mph.", "70 mph."]}, {"n": 11, "q": "During normal weather and traffic conditions, keep a minimum following distance of:", "a": "Two seconds.", "expl": "The more distance between your vehicle and others, the more time you have to react. Keep a minimum following distance of two seconds during normal weather and traffic conditions. Increase your following distance during unusual weather or traffic conditions.", "choices": ["Two seconds.", "Five seconds.", "One second.", "Four seconds."]}, {"n": 12, "q": "The fastest a driver should drive when backing up is:", "a": "10 mph.", "expl": "Back very slowly and not faster than 10 mph. Your vehicle is more difficult to control and stop when it is backing.", "choices": ["5 mph.", "15 mph.", "10 mph.", "25 mph."]}, {"n": 13, "q": "Drivers should try to see ____ ahead on the road.", "a": "10 to 15 seconds", "expl": "Good drivers try to see 10 to 15 seconds ahead on the roadway. By looking ahead, you may avoid unnecessary last-minute moves, such as sudden stops or quick lane changes.", "choices": ["10 to 15 seconds", "5 to 8 seconds", "3 to 5 seconds", "20 to 30 seconds"]}, {"n": 14, "q": "Drivers should check their mirrors approximately every:", "a": "10 seconds.", "expl": "About every 10 seconds, check your mirrors to see if any vehicle is following too closely. When checking your mirrors, do not take your eyes off the road for more than an instant. The vehicle in front of you could stop suddenly.", "choices": ["3 seconds.", "30 seconds.", "60 seconds.", "10 seconds."]}, {"n": 15, "q": "When driving at speeds of 45 mph or faster, you should signal to turn ____ before beginning the turn.", "a": "200 feet", "expl": "When you wish to change lanes or make a turn, signal to inform other motorists of your intentions. Signals should be activated at least 200 feet before you make the turn when you are driving at speeds faster than 45 mph. Continue signaling until you have completed the turn or lane change.", "choices": ["100 feet", "50 feet", "200 feet", "500 feet"]}, {"n": 16, "q": "A license will be suspended for ____ for a first-time conviction of driving at a speed of 55 mph and more than 15 mph above the speed limit.", "a": "30 days", "expl": "If you are driving 55 mph or faster and have exceeded the speed limit by 15 mph or more, and it is your first conviction for doing so, you will lose your license for at least 30 days. Penalties increase with subsequent violations.", "choices": ["30 days", "15 days", "90 days", "60 days"]}, {"n": 17, "q": "A license will be suspended for ____ for a second conviction of driving at a speed of 55 mph and more than 15 mph above the speed limit.", "a": "60 days", "expl": "If you are driving 55 mph or faster and have exceeded the speed limit by 15 mph or more, and it is your second conviction within a year, you will lose your license for at least 60 days. The suspension may be in addition to other criminal penalties.", "choices": ["6 months", "90 days", "30 days", "60 days"]}, {"n": 18, "q": "A vehicle must pass a safety inspection:", "a": "Once a year.", "expl": "Before you can renew your vehicle's registration, it must pass an annual safety inspection. This inspection must occur within 90 days of when you are renewing the vehicle. In several North Carolina counties, an emission inspection is also required.", "choices": ["Only when the vehicle is sold.", "Once a year.", "Every six months.", "Once every two years."]}, {"n": 19, "q": "If possible, before beginning down a steep hill, you should:", "a": "Switch into a lower gear.", "expl": "If possible, shift your vehicle into a lower gear before beginning to drive down a long, steep hill. Doing this will prevent you from causing excessive wear to the brakes by using your brakes too much to slow your vehicle while driving down the hill.", "choices": ["Turn off your engine.", "Shift into neutral.", "Switch into a lower gear.", "Apply the parking brake lightly."]}, {"n": 20, "q": "You must have a driver license to:", "a": "Steer a vehicle that is being towed or pushed.", "expl": "It is against the law to sit in the front seat of a running vehicle without a driver license. A person may also not sit in the front seat of a vehicle and steer while the vehicle is being pushed or towed.", "choices": ["Walk across a marked crosswalk.", "Steer a vehicle that is being towed or pushed.", "Ride a bicycle on public roads.", "Sit in the front seat of a moving vehicle."]}, {"n": 21, "q": "Refusing to take a chemical test when requested to do so by an officer will result in:", "a": "License revocation.", "expl": "Refusal to cooperate with an officer who has requested a chemical test will result in the immediate revocation of your driver license for at least 30 days and an additional revocation by the DMV for at least 12 months.", "choices": ["License revocation.", "Mandatory driver education classes.", "A fine only.", "An automatic jail sentence."]}, {"n": 22, "q": "If your license has been suspended for a third time due to the point system, it will be suspended for:", "a": "12 months.", "expl": "In North Carolina, your license can be suspended due to the accumulation of points given for traffic infractions. For a first suspension due to the point system, you'll lose your license for 60 days. For a third suspension, you'll lose your license for 12 months.", "choices": ["30 days.", "12 months.", "60 days.", "6 months."]}, {"n": 23, "q": "You may be required to attend a driver improvement clinic if you accumulate ____ against your license.", "a": "Seven points", "expl": "If you accumulate seven points against your license, you may be required to attend a driver improvement clinic. Completing the clinic will remove three points from your driving record.", "choices": ["Five points", "Twelve points", "Four points", "Seven points"]}, {"n": 24, "q": "You will have ____ added to your driving record for passing a stopped school bus.", "a": "Five points", "expl": "In North Carolina, points will accumulate against your driving record if you are convicted of certain traffic infractions. You will have five points added against your license if you pass a stopped school bus or if you are driving aggressively.", "choices": ["Four points", "Five points", "Three points", "Two points"]}, {"n": 25, "q": "About ____ of all traffic fatalities involve alcohol.", "a": "38 percent", "expl": "Drinking and driving is both illegal and dangerous. About 38 percent of all traffic fatalities involve alcohol.", "choices": ["25 percent", "38 percent", "10 percent", "50 percent"]}, {"n": 26, "q": "In urban areas, about ____ people killed in traffic accidents are pedestrians.", "a": "Two out of every five", "expl": "Drivers must be especially cautious when driving near pedestrians. In urban areas, about two in every five people killed in traffic accidents are pedestrians. In rural areas, about one in every ten people killed in traffic accidents are pedestrians.", "choices": ["Three out of every four", "One out of every five", "Two out of every five", "One out of every ten"]}, {"n": 27, "q": "It is illegal for a person 21 years of age or older to drive with a minimum blood alcohol concentration (BAC) of:", "a": "0.08 percent.", "expl": "For drivers age 21 or older, it is illegal to operate a motor vehicle with a blood alcohol concentration (BAC) of 0.08 percent or higher. Driving while under the influence of alcohol is not only illegal, but dangerous.", "choices": ["0.10 percent.", "0.05 percent.", "0.08 percent.", "0.02 percent."]}, {"n": 28, "q": "Tailgating other drivers (driving too closely to their rear bumper):", "a": "Can frustrate other drivers and make them angry.", "expl": "Tailgating is a common behavior that can lead to aggressive driving, and so it should be avoided. Drivers may face legal consequences for driving unsafely.", "choices": ["Is recommended on freeways during rush hour.", "Can frustrate other drivers and make them angry.", "Is a safe way to stay alert in traffic.", "Helps other drivers know you are in a hurry."]}, {"n": 29, "q": "Driving under the influence of any medication which impairs your driving is permitted:", "a": "Under no circumstances.", "expl": "It is illegal to drive under the influence of any substance that impairs your ability to drive safely. This includes alcohol, prescription medications, over-the-counter medications, and illegal drugs.", "choices": ["Only at night.", "If you feel unaffected by the medication.", "Under no circumstances.", "If the medication was prescribed by a doctor."]}, {"n": 30, "q": "A solid yellow line next to a broken yellow line means that vehicles:", "a": "Next to the broken line may pass.", "expl": "Yellow lines separate lanes of traffic moving in opposite directions. A broken yellow line next to your driving lane means that you may pass.", "choices": ["Next to the broken line may pass.", "On both sides may pass.", "Next to the solid line may pass.", "On neither side may pass."]}, {"n": 31, "q": "You want to park uphill on a two-way road and there is no curb. Which direction do you turn your front wheels?", "a": "Right, toward the side of the road", "expl": "When parking either uphill or downhill on a road that has no curb, you should turn your wheels so that the vehicle will roll away from the center of the road if the brakes fail.", "choices": ["Right, toward the side of the road", "Straight ahead, with wheels parallel to the road", "Away from the side of the road", "Left, toward the center of the road"]}, {"n": 32, "q": "You are involved in a minor collision at an intersection. There are no injuries and there is very little vehicle damage. You should:", "a": "Move your vehicle out of the traffic lane, if possible.", "expl": "After a collision, if no one has been injured or killed and you can safely do so, you should move your vehicle out of the traffic lane.", "choices": ["Stand in the travel lane to flag down other drivers.", "Leave your vehicle in the intersection until police arrive.", "Move your vehicle out of the traffic lane, if possible.", "Drive home and report the collision later."]}, {"n": 33, "q": "You are driving on the freeway behind a large truck. You should drive:", "a": "Farther behind the truck than you would if following a passenger vehicle.", "expl": "It is necessary to follow farther behind a large truck than you would if following a passenger vehicle because trucks have larger blind spots.", "choices": ["Farther behind the truck than you would if following a passenger vehicle.", "In front of the truck as closely as possible.", "Closer to the truck than you would if following a passenger vehicle.", "Directly beside the truck in the next lane."]}, {"n": 34, "q": "You must yield to a pedestrian using a white cane or guide dog:", "a": "At all times.", "expl": "Pedestrians who use guide dogs or white canes (with or without a red tip) must be given the right-of-way at all times.", "choices": ["Only in crosswalks.", "Only if the pedestrian is crossing with a green light.", "At all times.", "Only during daylight hours."]}, {"n": 35, "q": "To see vehicles in your blind spots, you should check:", "a": "Over your shoulders.", "expl": "By definition, blind spots are areas that cannot be seen using your mirrors. To check your blind spots, you should look over your shoulders.", "choices": ["Over your shoulders.", "Your rearview mirror only.", "Your side mirrors only.", "Your dashboard instruments."]}, {"n": 36, "q": "You are on the freeway and traffic is merging into your lane. You should:", "a": "Make room for the merging traffic, if possible.", "expl": "When traffic permits, you should make room to allow vehicles to merge into your lane.", "choices": ["Maintain your speed and position.", "Speed up and close any gaps.", "Stop and wait for the merging traffic to pass.", "Make room for the merging traffic, if possible."]}, {"n": 37, "q": "Extra space in front of a large truck is needed for:", "a": "The truck driver to stop the vehicle.", "expl": "Because they are larger, trucks take longer to stop than cars traveling at the same speed. Other drivers should not pull in front of a truck and then slow down or stop.", "choices": ["Other drivers to pass the truck.", "The truck driver to stop the vehicle.", "Passenger vehicles to park temporarily.", "The truck to accelerate more quickly."]}, {"n": 38, "q": "When passing another vehicle, it is safe to return to your lane if you:", "a": "See the vehicle’s headlights in your rearview mirror.", "expl": "Before returning to your original lane after passing, you must make sure you are not dangerously close to the vehicle you have just passed. When you can see both of the vehicle's headlights in your rearview mirror, you may have enough room to return to the lane.", "choices": ["Can no longer see the vehicle in your side mirror.", "See the vehicle’s headlights in your rearview mirror.", "Have passed the other vehicle's front bumper.", "Have signaled for at least two seconds."]}, {"n": 39, "q": "If you see orange construction signs and cones on a freeway, you must:", "a": "Be prepared for workers and equipment ahead.", "expl": "As you enter a work zone, signs and message boards will warn you of workers, slow- moving equipment, and/or closed lanes ahead. You should reduce your speed and be prepared to slow down or stop.", "choices": ["Speed up to clear the work zone quickly.", "Ignore the signs if traffic is light.", "Come to a complete stop immediately.", "Be prepared for workers and equipment ahead."]}, {"n": 40, "q": "When you are merging onto the freeway, you should be driving:", "a": "At or near the speed of traffic on the freeway.", "expl": "When merging onto a freeway, you should enter at or near the speed of traffic.", "choices": ["At a complete stop before entering.", "At or near the speed of traffic on the freeway.", "Much faster than traffic on the freeway.", "Much slower than traffic on the freeway."]}, {"n": 41, "q": "A school bus is stopped ahead of you in your lane with its red lights flashing. You should:", "a": "Stop for as long as the red lights are flashing.", "expl": "When a stopped school bus is using its flashing red lights, approaching drivers must stop and remain stopped until the lights stop flashing. If the school bus is on the opposite side of a divided highway, drivers do not need to stop.", "choices": ["Stop only if children are getting on or off.", "Slow down and pass carefully.", "Honk and proceed if the bus is on the shoulder.", "Stop for as long as the red lights are flashing."]}, {"n": 42, "q": "If you plan to pass another vehicle, you should:", "a": "Not assume the other driver will make space for you to return to your lane.", "expl": "Even when you signal, you should not assume that the space you want to occupy is free or that other drivers will give you the right-of-way.", "choices": ["Flash your headlights and pass immediately.", "Assume the other driver will make space for you.", "Not assume the other driver will make space for you to return to your lane.", "Speed up without checking your mirrors."]}, {"n": 43, "q": "A large truck is ahead of you and is turning right onto a street with two lanes in each direction. The truck:", "a": "May have to swing wide to complete the right turn.", "expl": "When a vehicle makes a turn, the rear wheels follow a shorter path than the front wheels. The longer the vehicle, the bigger the difference between the paths of the front and rear wheels. Therefore, long trucks often have to swing wide to complete a right turn.", "choices": ["May have to swing wide to complete the right turn.", "Will stay entirely in the right lane while turning.", "Must wait for you to pass before turning.", "Is required to use the left lane to turn right."]}, {"n": 44, "q": "You drive defensively when you:", "a": "Keep your eyes moving to look for possible hazards.", "expl": "You are driving defensively when you are looking down the road for potential hazards. Constantly staring at the road directly in front of your vehicle is dangerous. As you scan ahead, be alert to vehicles around you.", "choices": ["Keep your eyes moving to look for possible hazards.", "Drive as fast as the posted speed limit allows.", "Focus only on the vehicle directly ahead.", "Keep one hand free for using your phone."]}, {"n": 45, "q": "Always stop before crossing railroad tracks when:", "a": "There isn't room on the other side for you to completely cross the tracks.", "expl": "Expect a train on any track, at any time, traveling in either direction. If you need to stop after crossing the tracks, wait until you can completely cross the tracks before proceeding. Make sure your vehicle clears the tracks before you stop.", "choices": ["You hear a train whistle in the distance only.", "The crossing has no gates or lights.", "You are driving a large truck.", "There isn't room on the other side for you to completely cross the tracks."]}, {"n": 46, "q": "You should use your horn when:", "a": "It may help prevent a collision.", "expl": "Only use your horn when it is necessary to avoid collisions. Do not use your horn if a driver or bicyclist is moving slowly and you want him or her to drive faster or get out of your way.", "choices": ["You are angry at another driver.", "It may help prevent a collision.", "Another driver is moving slowly.", "You want other drivers to get out of your way."]}, {"n": 47, "q": "If you drive more slowly than the flow of traffic, you will most likely:", "a": "Interfere with traffic and receive a ticket.", "expl": "You must drive more slowly than usual when there is heavy traffic or bad weather. However, if you block the normal and reasonable movement of traffic by driving too slowly, you may be cited. You should match the speed of traffic, unless the speed of traffic exceeds the legal speed limit.", "choices": ["Improve traffic flow for everyone.", "Have the right-of-way over faster traffic.", "Interfere with traffic and receive a ticket.", "Be safer than driving with the flow."]}, {"n": 48, "q": "Allow extra space in front of your vehicle when following a:", "a": "Motorcycle.", "expl": "Allow for extra space when driving behind a motorcycle. Motorcycles can stop more quickly than other vehicles can and you must have adequate room to stop if the motorcyclist brakes or falls off. Also, remember that motorcycles are difficult to see at night because they only have one tail light.", "choices": ["Passenger car.", "Traffic signal.", "Empty parking space.", "Motorcycle."]}, {"n": 49, "q": "You must show proof of insurance to law enforcement:", "a": "If you are involved in a collision or stopped for a citation.", "expl": "You must have evidence of financial responsibility, such as proof of insurance, with you whenever you drive. You must always show proof of insurance and your license to an officer upon request after a traffic stop or collision.", "choices": ["Only if you are involved in a collision with injuries.", "Only when renewing your license.", "Only during a roadside safety check.", "If you are involved in a collision or stopped for a citation."]}, {"n": 50, "q": "You want to turn left at an upcoming corner. Yield the right-of-way to:", "a": "All approaching vehicles.", "expl": "When making a left turn, you must yield to pedestrians, bicyclists, or other vehicles moving on their green light.", "choices": ["Pedestrians only, not vehicles.", "Vehicles behind you only.", "All approaching vehicles.", "Only vehicles turning right."]}, {"n": 51, "q": "Before you change lanes, you should check your mirrors and:", "a": "Glance over your shoulder.", "expl": "Before changing lanes, it is very important to check behind you. You should look over your shoulder to ensure that you are not getting in the way of vehicles in the lane you want to enter. Before changing lanes, you should also ensure that no drivers are attempting to drive into the same spot from a different lane.", "choices": ["Honk your horn.", "Speed up quickly.", "Glance over your shoulder.", "Turn on your high beams."]}, {"n": 52, "q": "You want to park downhill on a two-way road and there is no curb. Which way do you turn your front wheels?", "a": "Right, toward the side of the road", "expl": "When parking facing downhill on a road with or without a curb, or when facing uphill on a road without a curb, turn your front wheels toward the edge of the road so your vehicle will roll away from traffic if the brakes fail. However, when parking uphill on a road with a curb, turn your wheels toward the center of the road so the vehicle will roll into the curb if the brakes fail.", "choices": ["Left, toward the center of the road", "Straight ahead, with wheels parallel to the road", "Right, toward the side of the road", "Away from the side of the road"]}, {"n": 53, "q": "You should not start across an intersection if you know you will block the intersection when the light turns red:", "a": "Under any circumstances.", "expl": "Even if the signal is green, you must not enter an intersection unless you can get completely across before the light turns red. If you block the intersection, you can be cited.", "choices": ["If traffic behind you is heavy.", "Under any circumstances.", "During rush hour only.", "If the light is about to turn red."]}, {"n": 54, "q": "A pedestrian starts to cross the street after the \"Don't Walk\" signal begins to flash. The pedestrian is in the middle of the street when your signal light changes to green. You should:", "a": "Wait until the pedestrian crosses the street before proceeding.", "expl": "At a green light, you must give the right-of-way to any vehicle, bicyclist, or pedestrian in the intersection. If a pedestrian begins crossing the street after the traffic signal light starts flashing, wait until they have crossed the street before proceeding.", "choices": ["Continue if you have a green light.", "Proceed carefully around the pedestrian.", "Wait until the pedestrian crosses the street before proceeding.", "Honk so the pedestrian returns to the curb."]}, {"n": 55, "q": "A vehicle suddenly cuts in front of you, creating a hazard. What should you do first?", "a": "Take your foot off the gas pedal.", "expl": "If a vehicle merges in front of you too closely, take your foot off of the accelerator. This will create space between you and the vehicle ahead without requiring you to slam on your brakes or swerve into another lane.", "choices": ["Slam on the brakes immediately.", "Swerve into another lane without checking.", "Take your foot off the gas pedal.", "Speed up to pass the vehicle."]}, {"n": 56, "q": "A red arrow pointing to the right on a traffic light means you may:", "a": "Not turn in that direction until the light turns green.", "expl": "A red arrow means \"stop.\" You must remain stopped until a green light or green arrow appears. Do not turn against a red arrow.", "choices": ["Not turn in that direction until the light turns green.", "Turn only if the intersection is clear.", "Turn after coming to a complete stop.", "Turn after yielding to oncoming traffic."]}, {"n": 57, "q": "An orange and red triangular sign on a vehicle always means:", "a": "Slow-moving vehicle.", "expl": "Slow-moving vehicles, such as farm tractors, road maintenance vehicles, and animal- drawn carts, display an orange and red triangle on the back.", "choices": ["A vehicle carrying hazardous materials.", "An emergency vehicle.", "A school bus.", "Slow-moving vehicle."]}, {"n": 58, "q": "You must yield the right-of-way to an emergency vehicle that is using its siren and flashing lights by:", "a": "Driving as closely to the right edge of the road as possible and stopping.", "expl": "You must yield the right-of-way to any emergency vehicle that is using its siren and flashing lights. Do this by driving to the right edge of the road and stopping, taking care not to stop in an intersection. You may move again after the emergency vehicle has passed.", "choices": ["Stopping immediately in your lane.", "Continuing at the same speed.", "Driving as closely to the right edge of the road as possible and stopping.", "Speeding up to clear the intersection."]}, {"n": 59, "q": "You can drive off the road to pass another vehicle:", "a": "Under no circumstances.", "expl": "You may never drive off the paved or main-traveled portion of the road and onto the shoulder to pass another vehicle.", "choices": ["Under no circumstances.", "On rural roads with light traffic.", "If there is no oncoming traffic.", "If the vehicle ahead is going very slowly."]}, {"n": 60, "q": "On a freeway, you should look farther ahead than you would on a city street:", "a": "In order to see potential hazards early.", "expl": "On the freeway, be ready for changes in traffic conditions. Watch for signals from other drivers. Expect merging vehicles at on-ramps and interchanges and be prepared for rapid changes in road conditions and traffic flow.", "choices": ["Because city streets have higher speed limits.", "In order to see potential hazards early.", "Because freeway exits appear suddenly.", "Because freeway traffic moves more slowly."]}, {"n": 61, "q": "There are oncoming vehicles to your left and a row of parked vehicles to your right. You should steer:", "a": "A middle course between the oncoming and parked vehicles.", "expl": "If there are oncoming vehicles to your left and a row of parked vehicles to your right, the best thing to do is to split the difference. Steer a middle course between the oncoming cars and the parked cars.", "choices": ["Closer to the oncoming vehicles.", "Closer to the parked vehicles.", "A middle course between the oncoming and parked vehicles.", "Onto the shoulder if one is available."]}, {"n": 62, "q": "When should you yield your legal right-of-way?", "a": "Whenever it helps prevent collisions.", "expl": "Never assume other drivers will give you the right-of-way. Yield your right-of-way whenever it helps prevent collisions.", "choices": ["Only when directed by a police officer.", "Only at four-way stops.", "Whenever it helps prevent collisions.", "Never; always take your right-of-way."]}, {"n": 63, "q": "When may you legally drive around or under a railroad crossing gate?", "a": "Never.", "expl": "Do not go around or under any lowered gate at a railroad crossing. Once the gate is raised, do not proceed across the tracks until you can see clearly in both directions and are sure there are no trains coming.", "choices": ["When you are in a hurry.", "When no train is visible.", "When the gate appears stuck open.", "Never."]}, {"n": 64, "q": "There are two traffic lanes moving in your direction. You are driving in the left lane and many vehicles are passing you on the right. If the driver behind you wishes to drive faster, you should:", "a": "Move into the right lane when it is safe.", "expl": "To drive quickly, pass, or turn left, use the left lane. Use the right lane when driving more slowly than surrounding traffic, entering the road, or turning right.", "choices": ["Stop and wait for the other vehicle to pass.", "Stay in the left lane to allow others to pass.", "Speed up so others cannot pass you.", "Move into the right lane when it is safe."]}, {"n": 65, "q": "While driving at night, a vehicle coming toward you has its high beams on, making it hard for you to see the road ahead. You should:", "a": "Look ahead toward the right edge of your lane.", "expl": "If an oncoming driver fails to dim their high beams, you should avoid looking directly at the headlights. Instead, look toward the right edge of your lane and watch the oncoming vehicle out of the corner of your eye.", "choices": ["Look directly into the other driver's headlights.", "Look ahead toward the right edge of your lane.", "Close your eyes until the vehicle passes.", "Turn on your high beams in response."]}, {"n": 66, "q": "You should increase the distance between your vehicle and the vehicle ahead when you:", "a": "Are being tailgated by another driver.", "expl": "When being tailgated, create extra space in front of your vehicle and do not brake suddenly. Slow down gradually or merge into another lane to prevent a collision with the tailgater.", "choices": ["Are driving alone on an empty road.", "Are traveling below the speed limit.", "Are in the right lane of a freeway.", "Are being tailgated by another driver."]}, {"n": 67, "q": "If your vehicle starts to lose traction because of water on the road, you should:", "a": "Slow down gradually and not apply the brakes.", "expl": "When driving in heavy rain at speeds as low as 30 mph, your tires may lose all contact with the road and instead ride up on a layer of water above the surface of the road. This is called \"hydroplaning.\" If your vehicle starts to hydroplane, slow down gradually and do not apply the brakes.", "choices": ["Turn the steering wheel sharply.", "Slam on the brakes immediately.", "Speed up to get through the water.", "Slow down gradually and not apply the brakes."]}, {"n": 68, "q": "You are crossing an intersection and an emergency vehicle is approaching while using its siren and flashing lights. You should:", "a": "Continue through the intersection, pull to the right, and stop.", "expl": "If you are in an intersection when you see an emergency vehicle approaching while using its flashing lights and/or siren, continue through the intersection and then drive to the right and stop. You must yield the right-of-way to any police vehicle, fire engine, ambulance, or other emergency vehicle using a siren or flashing lights.", "choices": ["Pull to the left and stop.", "Continue through the intersection, pull to the right, and stop.", "Stop immediately in the intersection.", "Speed up to clear the intersection, then continue."]}, {"n": 69, "q": "When making a right turn on a green light, you must:", "a": "Yield to pedestrians.", "expl": "Unless a posted sign prohibits it, you may turn right or left at a steady green light. When turning, you must yield to other vehicles and pedestrians within the intersection.", "choices": ["Yield to pedestrians.", "Signal only after you begin the turn.", "Stop completely before turning.", "Speed up to clear the intersection quickly."]}, {"n": 70, "q": "When you drive through an area where children are playing, you should expect them:", "a": "To run out in front of you without looking.", "expl": "You should always reduce your speed and use extra caution when children are in the vicinity. They may fail to understand the danger and may run out in front of you without looking.", "choices": ["To stay on the sidewalk at all times.", "To run out in front of you without looking.", "To wait for you to pass before crossing.", "To look carefully before entering the street."]}, {"n": 71, "q": "If you stop at a railroad crossing with more than one track:", "a": "Wait to proceed until you have a clear view of all tracks.", "expl": "If you are stopped at a railroad crossing with more than one track, do not start moving as soon as a train passes. Wait until you have a clear view down all tracks before you start across. Even where there is only one track, do not start across immediately after a train passes; check again for another train that may be approaching.", "choices": ["Wait to proceed until you have a clear view of all tracks.", "Proceed as soon as the first train passes.", "Rely only on the crossing signals.", "Cross quickly without stopping again."]}, {"n": 72, "q": "While backing, you should:", "a": "Turn your head and look through the rear window.", "expl": "When intending to back up, always check behind your vehicle before getting in. Children and small objects are difficult to see from the driver’s seat. While backing, turn your head so you can see through the rear window. Do not depend only on your mirrors or sensors.", "choices": ["Open your door and look behind you.", "Rely only on your rearview mirror.", "Turn your head and look through the rear window.", "Look only at your side mirrors."]}, {"n": 73, "q": "To help prevent crashes, you should:", "a": "Communicate with other road users.", "expl": "Crashes often happen because one driver does something that other road users are not expecting. You should communicate with other motorists, bicyclists, and pedestrians by doing things like signaling when slowing down, stopping, or changing direction. Use your emergency signals or horn when appropriate.", "choices": ["Avoid using turn signals to surprise others.", "Focus only on vehicles ahead of you.", "Drive as close as possible to other vehicles.", "Communicate with other road users."]}, {"n": 74, "q": "If your turn signals fail, you should use ____ to indicate that you are turning.", "a": "Hand signals", "expl": "If your vehicle's turn signals do not work, you should use hand signals to indicate when you intend to change direction.", "choices": ["Hand signals", "Your horn", "Your emergency flashers", "Your headlights only"]}, {"n": 75, "q": "Your brake lights tell other drivers that you:", "a": "Are slowing down or stopping.", "expl": "Your vehicle's brake lights indicate to other drivers that you are slowing down or stopping. Your brake lights should always be in working order when you are driving on any roadway.", "choices": ["Have an emergency.", "Are about to turn.", "Are slowing down or stopping.", "Are changing lanes."]}, {"n": 76, "q": "If you begin to feel tired while driving, the best thing to do is to:", "a": "Stop driving.", "expl": "Being fatigued while driving is similar in danger to driving under the influence of alcohol. If you begin to feel tired while driving, the best thing to do is to stop driving.", "choices": ["Open a window and keep driving.", "Drink coffee and keep driving.", "Turn up the radio and keep driving.", "Stop driving."]}, {"n": 77, "q": "If another driver cuts you off in traffic, you should:", "a": "Let it go.", "expl": "To avoid the dangers of road rage, you should never take it personally if another driver cuts you off in traffic. Just let it go and continue driving safely.", "choices": ["Chase them to confront them.", "Let it go.", "Tailgate them in return.", "Honk continuously until they move."]}, {"n": 78, "q": "If your car breaks down on a highway, you should:", "a": "Use your four-way flashers to warn other drivers.", "expl": "If your vehicle breaks down on the highway, you should signal before carefully exiting the roadway and turning on your hazard flashers. Get as far off the road as possible and park in a location where other drivers can easily see you. Lift your hood to let other drivers know your vehicle is disabled.", "choices": ["Stand in the travel lane and wave for help.", "Leave your vehicle and walk along the highway.", "Use your four-way flashers to warn other drivers.", "Try to repair the vehicle in a travel lane."]}, {"n": 79, "q": "To pass a slower-moving vehicle on a two-lane, two-way road, you must:", "a": "Use the lane that belongs to oncoming traffic.", "expl": "Passing on a two-lane, two-way road requires good judgment because you must use the lane belonging to oncoming traffic to complete your pass. Only pass if you may safely and legally do so.", "choices": ["Wait until the other vehicle pulls over.", "Use the shoulder of the road.", "Honk and pass on the right.", "Use the lane that belongs to oncoming traffic."]}, {"n": 80, "q": "The most important thing to remember about speed management and curves is that you must:", "a": "Slow down before you enter the curve.", "expl": "The most important thing to remember about driving in curves is that your vehicle’s inertia may make it difficult to turn. To maintain control, it is essential that you slow down before entering the curve.", "choices": ["Maintain your speed through the curve.", "Brake hard while in the curve.", "Speed up before you enter the curve.", "Slow down before you enter the curve."]}, {"n": 81, "q": "When exiting a highway, you should slow down:", "a": "Once you have moved into the exit lane.", "expl": "When exiting a highway, you should get into the exit lane well in advance. Do not begin to slow down until after you have moved into the exit lane.", "choices": ["Once you have moved into the exit lane.", "While still in the main travel lanes.", "Only after you leave the exit ramp.", "Before signaling for the exit."]}, {"n": 82, "q": "If you want to get off the freeway but you have missed your exit, you should:", "a": "Go to the next exit.", "expl": "If you miss your exit, you should take the next exit. Do not stop or back up on the highway, swerve across multiple lanes to try to make the exit at the last second, or cross over the median to turn around. All of these maneuvers are illegal and extremely dangerous.", "choices": ["Cross the grass to reach the exit.", "Go to the next exit.", "Stop and back up to the exit.", "Make a U-turn across the median."]}, {"n": 83, "q": "It is best to keep a space cushion:", "a": "On all sides of the vehicle.", "expl": "To ensure that you will have time to react to hazards on the roadway, it is best to keep a cushion of space on all sides of your vehicle. Do not crowd vehicles to your left and right sides.", "choices": ["On all sides of the vehicle.", "Only in front of the vehicle.", "Only on the left side of the vehicle.", "Only behind the vehicle."]}, {"n": 84, "q": "Allowing a space cushion between your vehicle and its surroundings is important because it:", "a": "Allows you time to react to unexpected situations.", "expl": "The only way to be sure you will have enough time to react to mistakes made by other drivers is to leave plenty of space between you and the vehicles around you.", "choices": ["Allows you to use your phone safely.", "Allows you time to react to unexpected situations.", "Means you never need to signal.", "Lets you drive faster than other traffic."]}, {"n": 85, "q": "Allow a larger space cushion than usual when stopping:", "a": "On an incline.", "expl": "You should allow more space in front of your vehicle than usual when you are stopped on an uphill slope. If the vehicle in front of you rolls backward toward your vehicle when traffic begins to move again, it is less likely that there will be a collision.", "choices": ["When following a motorcycle.", "On an incline.", "On a dry, flat highway.", "In light traffic."]}, {"n": 86, "q": "When making a turn, you must ____ your speed.", "a": "Reduce", "expl": "When turning, you should reduce to a speed that allows you to maintain control of your vehicle, stay in your lane, and react to unexpected situations.", "choices": ["Reduce", "Double", "Maintain", "Increase"]}, {"n": 87, "q": "Drive below the posted speed limit when:", "a": "Anything makes conditions less than perfect.", "expl": "When the road is wet or slippery, when you cannot see well, or when anything else makes conditions less than perfect, drive below the posted speed limit. Even if you are driving within the posted speed limit, you can still be ticketed for driving too fast for conditions.", "choices": ["You are the only vehicle on the road.", "Anything makes conditions less than perfect.", "You are in a hurry.", "Weather and road conditions are ideal."]}, {"n": 88, "q": "The amount of space you need to cross traffic depends on the:", "a": "Road conditions, weather conditions, and oncoming traffic.", "expl": "The amount of space you need to cross traffic depends on the road conditions, weather conditions, and oncoming traffic.", "choices": ["Color of the traffic signals.", "Road conditions, weather conditions, and oncoming traffic.", "Number of passengers in your car.", "Size of your vehicle only."]}, {"n": 89, "q": "Your ability to stop is affected by:", "a": "The condition of the road.", "expl": "Your ability to stop is greatly affected by the condition of the road. You need to reduce your speed when road conditions are poor in order to maintain control of your vehicle. You will be at risk if you are driving too quickly on roads that are slippery and you need to stop.", "choices": ["The color of your vehicle.", "The day of the week.", "The condition of the road.", "The radio volume."]}, {"n": 90, "q": "To prepare for anything coming up on the road ahead, you should:", "a": "Continually scan the entire road and all roadsides.", "expl": "Your ability to handle dangerous traffic situations depends largely on searching for and identifying problems before meeting them. Looking far ahead of your vehicle does not mean you should simply stare at the center of the road. You need to continually scan the entire road, including the sides of the road.", "choices": ["Look only at the center of your lane.", "Continually scan the entire road and all roadsides.", "Check your phone for traffic updates.", "Focus only on the car ahead of you."]}, {"n": 91, "q": "When faced with an oncoming car to the left and a bicyclist to the right, you should:", "a": "Let the car pass and then pass the bike.", "expl": "When there is more than one potential hazard on the road, you should ensure that you only have to deal with one of them at a time. For example, when there is a bicyclist on the right that you want to pass and an oncoming car to the left, you should not try to squeeze between both at the same time. Instead, let the oncoming car pass, and then pass the bicyclist.", "choices": ["Speed up and pass both at once.", "Let the car pass and then pass the bike.", "Honk and expect both to move aside.", "Squeeze between the car and the bike."]}, {"n": 92, "q": "When driving on slick roads, you should:", "a": "Take turns more slowly than usual.", "expl": "While it is always dangerous to drive too fast on slippery roads, this is especially true when driving in turns and curves. Be sure to approach them more slowly in slippery conditions than you would under normal circumstances.", "choices": ["Brake hard before every turn.", "Speed up to avoid losing control.", "Drive as you would on dry roads.", "Take turns more slowly than usual."]}, {"n": 93, "q": "When driving on slippery roads, you should:", "a": "Increase your following distance.", "expl": "On slippery roads, you should increase your following distance. It may take more time to stop your vehicle than it would under normal conditions.", "choices": ["Use cruise control whenever possible.", "Increase your following distance.", "Decrease your following distance.", "Make sudden turns and stops."]}, {"n": 94, "q": "Roads freeze quickly when they are:", "a": "Shaded.", "expl": "In cold or wet weather, you should take special care on sections of road that are shaded by trees or buildings. These areas freeze more quickly than the rest of the road and are the last parts of the road to dry.", "choices": ["Busy with traffic.", "Shaded.", "In direct sunlight.", "Recently paved."]}, {"n": 95, "q": "What is the appropriate action to take when approaching a railroad crossing that does not have signals to direct traffic?", "a": "Slow down and be prepared to stop.", "expl": "When approaching an unmarked railroad crossing, slow down and be prepared to stop. Before you cross, be sure that no trains are approaching from either direction on any track. If you see or hear a train coming, stop at a safe distance from the nearest track and wait to proceed until after the train passes.", "choices": ["Speed up and cross the tracks quickly.", "Stop on the tracks and look both ways.", "Ignore the crossing if no train is visible.", "Slow down and be prepared to stop."]}, {"n": 96, "q": "What is the only way to reduce your blood alcohol concentration (BAC)?", "a": "Allow your body time to get rid of the alcohol.", "expl": "The only method that effectively reduces your BAC is to not drink alcohol for a period of time. Coffee, exercise, and cold showers cannot reduce your BAC or change the effects of alcohol. They can help you remain awake, but they cannot change your BAC or make you sober.", "choices": ["Take a cold shower.", "Drink coffee.", "Allow your body time to get rid of the alcohol.", "Exercise vigorously."]}, {"n": 97, "q": "A driver should be extra alert to motorcyclists, bicyclists, and pedestrians because:", "a": "They’re difficult to see in traffic.", "expl": "In many collisions with motorcycles, bicycles, and pedestrians, drivers reported that they were looking but still did not see the smaller vehicle or pedestrian. These can be more difficult to spot in traffic than passenger vehicles because they are smaller, may move faster, and have less noticeable lighting. To prevent collisions with these smaller and less protected road users, drivers should always be alert to the presence of motorcycles, bikes, and pedestrians.", "choices": ["They travel much faster than cars.", "They are not allowed on most roads.", "They’re difficult to see in traffic.", "They always have the right-of-way."]}, {"n": 98, "q": "At an intersection with a yield sign, you should:", "a": "Slow down and yield the right-of-way to other traffic.", "expl": "A yield sign means that you must slow down and yield the right-of-way to traffic in the intersection or roadway you are entering.", "choices": ["Proceed without slowing if the road looks clear.", "Slow down and yield the right-of-way to other traffic.", "Speed up to clear the intersection.", "Come to a complete stop every time."]}, {"n": 99, "q": "When parking uphill next to a curb, set the parking brake and:", "a": "Turn your steering wheel away from the curb.", "expl": "When parking facing uphill on a street that has a curb, set your parking brake and turn your steering wheel away from the curb. This way, if your vehicle starts to roll, it will roll into the curb.", "choices": ["Turn your steering wheel toward the curb.", "Turn your steering wheel away from the curb.", "Turn the wheels in either direction.", "Leave the wheels pointed straight ahead."]}, {"n": 100, "q": "When driving in fog, rain, or snow, use:", "a": "Low beams.", "expl": "Low beam headlights should be used in fog, rain, and snow. The light from high beams will reflect back to the driver under these weather conditions, causing a glare that will make it difficult to see ahead.", "choices": ["Parking lights only.", "No lights if traffic is light.", "Low beams.", "High beams."]}, {"n": 101, "q": "When driving at night, you should:", "a": "Increase your following distance.", "expl": "Increase your following distance when it is difficult to see due to darkness. Use headlights to increase visibility, following the rules for proper use of high beams and low beams. Avoid looking directly at the headlights of an oncoming vehicle to avoid being blinded by the glare.", "choices": ["Decrease your following distance.", "Increase your following distance.", "Look directly at oncoming headlights.", "Use only your parking lights."]}, {"n": 102, "q": "If you experience a tire blowout:", "a": "Slow down gradually and use your brakes lightly.", "expl": "If you experience a tire blowout, you should slow down gradually by taking your foot off of the accelerator. Don't apply the brakes until the vehicle has slowed considerably.", "choices": ["Slow down gradually and use your brakes lightly.", "Brake hard and steer sharply.", "Accelerate to regain control.", "Shift into park immediately."]}, {"n": 103, "q": "If you find yourself in a skid:", "a": "Stay off the brakes.", "expl": "If your vehicle begins to skid, do not use the brakes. Braking could make the skid worse.", "choices": ["Turn off the ignition.", "Brake hard immediately.", "Accelerate quickly.", "Stay off the brakes."]}, {"n": 104, "q": "In rainy weather, you should be most careful when turning or stopping:", "a": "During the first half hour of rain.", "expl": "You should be extra careful when turning and stopping during the first half hour of rain. At this point, the oil from cars has not yet washed off the pavement and could be forming a slippery mixture with the rain.", "choices": ["Only at night.", "After several hours of steady rain.", "During the first half hour of rain.", "Only on freeways."]}, {"n": 105, "q": "If two drivers arrive at the same time to a four-way intersection controlled by stop signs:", "a": "The driver on the right has the right-of-way.", "expl": "Yield the right-of-way to the driver on your right at a four-way intersection if you both arrive to the intersection at the same time. You may then proceed when it is safe to do so.", "choices": ["The driver on the left has the right-of-way.", "The faster driver has the right-of-way.", "The larger vehicle has the right-of-way.", "The driver on the right has the right-of-way."]}, {"n": 106, "q": "When a vehicle with an Anti-Lock Braking System starts to lose traction on a slippery road, drivers should:", "a": "Press and hold the brake pedal.", "expl": "If their vehicle loses traction on a slippery road, a driver with an Anti-Lock Braking System (ABS) needs to press down hard on the brake pedal, hold it, and steer out of danger. In an emergency situation, the ABS automatically pumps the brakes at a faster rate than the driver could. Removing steady pressure from the brake pedal or pumping the brakes will disengage the ABS.", "choices": ["Press and hold the brake pedal.", "Pump the brake pedal rapidly.", "Remove your foot from the brake.", "Turn the steering wheel sharply."]}, {"n": 107, "q": "If worried, nervous, angry, or crying, a driver:", "a": "Should take the time to focus on driving before starting the engine.", "expl": "You may not be able to drive well if you are worried, excited, crying, angry, or depressed. Emotions can distract you from your driving because your mind is focused on something else. Take time to calm down and get focused before driving.", "choices": ["Should drive to clear their mind.", "Will drive more carefully than usual.", "Should take the time to focus on driving before starting the engine.", "Should drive faster to finish sooner."]}, {"n": 108, "q": "When encountering an aggressive driver, you should:", "a": "Avoid eye contact, slow down, and let them pass.", "expl": "If another driver is threatening you or intentionally driving dangerously around you, remain calm and try to put as much distance between the two of you as possible. Slow down and let them pass. Do not make eye contact and do not make obscene gestures.", "choices": ["Honk and gesture at them.", "Speed up and refuse to let them pass.", "Make eye contact and challenge them.", "Avoid eye contact, slow down, and let them pass."]}, {"n": 109, "q": "Distracted driving is:", "a": "Extremely risky behavior.", "expl": "Distracted driving is extremely risky behavior that puts not only you and your passengers in danger, but also endangers pedestrians, bicyclists, and other motorists sharing the road. Focused attention on driving helps to prevent crashes.", "choices": ["Acceptable when traffic is light.", "Safe if you are an experienced driver.", "Extremely risky behavior.", "Only a problem for new drivers."]}, {"n": 110, "q": "A single broken yellow line down the center of a two-lane road indicates:", "a": "Lanes are moving in opposite directions and drivers are permitted to pass when it is", "expl": "safe to do so. Yellow lines are used to separate traffic moving in opposite directions. Dashed lines indicate that drivers directly next to the line are permitted to pass when it is safe to do so.", "choices": ["Lanes are moving in opposite directions and drivers are not permitted to pass.", "Lanes are moving in the same direction and drivers are permitted to pass.", "Lanes are moving in the same direction and drivers are not permitted to pass.", "Lanes are moving in opposite directions and drivers are permitted to pass when it is"]}, {"n": 111, "q": "A single broken white line down the center of a two-lane road indicates:", "a": "Lanes are moving in the same direction and drivers are permitted to pass when it is", "expl": "safe to do so. White lines are used to separate traffic moving in the same direction. Dashed lines indicate that drivers directly next to the line are permitted to pass when it is safe to do so.", "choices": ["Lanes are moving in the same direction and drivers are permitted to pass when it is", "Lanes are moving in the same direction and drivers are not permitted to pass.", "Lanes are moving in opposite directions and drivers are not permitted to pass.", "Lanes are moving in opposite directions and drivers are permitted to pass."]}, {"n": 112, "q": "A solid white line down the center of a two-lane road indicates:", "a": "Lanes are moving in the same direction and drivers are not permitted to pass.", "expl": "White lines are used to separate traffic moving in the same direction. Solid lines indicate that drivers are not permitted to pass.", "choices": ["Lanes are moving in the same direction and drivers are permitted to pass.", "Lanes are moving in opposite directions and drivers are permitted to pass.", "Lanes are moving in opposite directions and drivers are not permitted to pass.", "Lanes are moving in the same direction and drivers are not permitted to pass."]}, {"n": 113, "q": "A double solid yellow line down the center of a two-lane road indicates:", "a": "Lanes are moving in opposite directions and drivers are not permitted to pass.", "expl": "Yellow lines are used to separate traffic moving in opposite directions. Solid lines indicate that drivers are not permitted to pass.", "choices": ["Lanes are moving in the same direction and drivers are permitted to pass.", "Lanes are moving in opposite directions and drivers are permitted to pass.", "Lanes are moving in opposite directions and drivers are not permitted to pass.", "Lanes are moving in the same direction and drivers are not permitted to pass."]}, {"n": 114, "q": "Signs that are colored orange are:", "a": "Work zone signs.", "expl": "Highway work zones are established according to the type of work underway along the roadway. Signs in work areas are typically diamond-shaped, orange, have black letters or symbols, and serve as a warning that people are working on or near the highway.", "choices": ["Work zone signs.", "Guide signs.", "Regulatory signs.", "Stop signs."]}, {"n": 115, "q": "Guide signs are ____ signs that provide directional and mileage information to drivers.", "a": "Green", "expl": "Guide signs, sometimes known as destination signs, have a green background and provide directional and mileage information to specific destinations. They can be a helpful resource when driving in unfamiliar locations.", "choices": ["Red", "Green", "Yellow", "Blue"]}, {"n": 116, "q": "Regulatory signs are usually ____ and should always be obeyed.", "a": "White", "expl": "Regulatory signs regulate the movement of traffic. They are usually white with black markings and must always be obeyed by motorists.", "choices": ["White", "Orange", "Yellow", "Green"]}, {"n": 117, "q": "Pennant-shaped signs indicate:", "a": "No passing zones.", "expl": "Pennant-shaped signs usually indicate no passing zones. Text will also be on the sign to confirm that it is a no passing zone.", "choices": ["School zones.", "Yield areas.", "No passing zones.", "Hospital zones."]}, {"n": 118, "q": "Pentagonal signs indicate:", "a": "School zones.", "expl": "Pentagonal signs indicate that you are in a school zone. Be extra alert to children and pedestrians when driving near a school.", "choices": ["Yield areas.", "No passing zones.", "School zones.", "Railroad crossings."]}, {"n": 119, "q": "An octagonal sign is always a:", "a": "Stop sign.", "expl": "Octagonal signs are always stop signs. Come to a complete stop when approaching a red, eight-sided sign.", "choices": ["Yield sign.", "Warning sign.", "Speed limit sign.", "Stop sign."]}, {"n": 120, "q": "A diamond-shaped sign:", "a": "Warns of existing or possible hazards.", "expl": "Diamond-shaped signs warn drivers of existing or potential driving hazards. You will usually see these signs in yellow or orange.", "choices": ["Indicates a regulatory rule.", "Gives directional information.", "Warns of existing or possible hazards.", "Marks a no-passing zone."]}, {"n": 121, "q": "When approaching a steady yellow traffic light, drivers should:", "a": "Slow to a stop, unless they are already within the intersection.", "expl": "A steady yellow traffic light indicates that a red light is about to appear. Stop unless you are already within the intersection.", "choices": ["Come to a sudden stop in the intersection.", "Speed up to clear the intersection.", "Continue at the same speed without caution.", "Slow to a stop, unless they are already within the intersection."]}, {"n": 122, "q": "When approaching a steady red traffic light, drivers should:", "a": "Come to a complete stop.", "expl": "A steady red traffic light indicates that drivers must come to a complete stop. Driving through a red light is against the law and is extremely dangerous. Drivers may turn right on a steady red light if there is no sign prohibiting a turn on red.", "choices": ["Come to a complete stop.", "Speed up before the light changes.", "Slow down and proceed with caution.", "Yield and continue without stopping."]}, {"n": 123, "
