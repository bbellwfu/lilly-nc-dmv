fore a train arrives.", "Stop on the tracks to look for a train."]}, {"n": 127, "q": "If a flagger is directing traffic in a construction zone, you must:", "a": "Follow the directions given by the flagger.", "expl": "Be prepared to reduce your speed and use caution when directed to do so by a sign, flagger, or law enforcement officer. Failure to do so is illegal and is dangerous to those working in construction zones.", "choices": ["Follow the directions given by the flagger.", "Ignore the flagger if traffic is light.", "Follow the posted speed limit only.", "Drive around the construction cones."]}, {"n": 128, "q": "What do speed limit signs indicate?", "a": "The maximum or minimum speed that is legally allowed to be driven", "expl": "Speed limit signs indicate the maximum or minimum safe speed that is allowed to be driven on a roadway. The maximum limits are for ideal conditions and you must reduce your speed when conditions require it.", "choices": ["Recommended speeds for trucks only.", "The speed that guarantees you will not get a ticket.", "Suggested speeds for ideal conditions only.", "The maximum or minimum speed that is legally allowed to be driven"]}, {"n": 129, "q": "____ greatly increase stopping distances and severity of crashes.", "a": "High speeds", "expl": "High speeds greatly increase stopping distances and severity of crashes. The faster you drive, the greater the impact or striking power of your vehicle, should you be involved in a collision.", "choices": ["Seat belts", "High speeds", "Low speeds", "Daytime headlights"]}, {"n": 130, "q": "If you reach an intersection where you wish to turn but you are not in the proper lane, you should:", "a": "Drive to the next intersection and make your turn then.", "expl": "Never make last-minute turns. If you reach an intersection where you wish to turn but you are not in the proper lane to make the turn, drive to the next intersection and then make the turn from the proper lane.", "choices": ["Cut across multiple lanes to reach the turn lane.", "Stop and wait for an opening to change lanes.", "Drive to the next intersection and make your turn then.", "Make the turn from your current lane anyway."]}, {"n": 131, "q": "A driver entering public traffic from a driveway or private road:", "a": "Should yield to drivers already on the public road.", "expl": "If you are entering traffic from a driveway or private road, you should yield to drivers already on the public road. Merge safely into traffic when you are able to do so.", "choices": ["Should yield to drivers already on the public road.", "Has the right-of-way over all other traffic.", "Does not need to yield to pedestrians.", "Should accelerate quickly onto the public road."]}, {"n": 132, "q": "If two drivers arrive at the same time to an open intersection:", "a": "The driver on the right has the right-of-way.", "expl": "If you arrive to an open intersection at the same time as a vehicle to your right, you should yield the right-of-way to that vehicle. You may then proceed when it is safe to do so.", "choices": ["The driver on the right has the right-of-way.", "The driver on the left has the right-of-way.", "The larger vehicle has the right-of-way.", "The driver going straight must yield."]}, {"n": 133, "q": "If you are driving in another driver's blind spot, you should:", "a": "Move forward or drop back so the other driver can see you.", "expl": "Do not drive in someone else’s blind spot. Move forward or drop back so that the other driver can see you.", "choices": ["Speed up and remain alongside them.", "Stay there so the other driver knows you are present.", "Honk until the other driver notices you.", "Move forward or drop back so the other driver can see you."]}, {"n": 134, "q": "Larger vehicles have:", "a": "Larger blind spots.", "expl": "The larger the vehicle, the larger the blind spots. Large trucks and SUVs have spots close to their rears that cannot be seen in their side or rearview mirrors.", "choices": ["Larger blind spots.", "Smaller blind spots.", "Blind spots only on the left side.", "No blind spots."]}, {"n": 135, "q": "A driver entering interstate traffic from an entrance or acceleration ramp:", "a": "Should yield to drivers already on the interstate.", "expl": "If you are on an entrance or acceleration ramp and are entering interstate traffic, you should yield to drivers already on the interstate highway. Merge safely into traffic when you are able to do so.", "choices": ["Should yield to drivers already on the interstate.", "May enter without yielding if accelerating.", "Should stop at the end of the ramp and wait.", "Has the right-of-way over interstate traffic."]}, {"n": 136, "q": "If you are driving on the interstate and pass your exit, you should:", "a": "Continue driving and use the next exit.", "expl": "Don’t make a last-minute turn into an exit. If you pass your exit, you must go to the next one.", "choices": ["Cross the median to return to the exit.", "Stop and back up to the exit.", "Continue driving and use the next exit.", "Make a U-turn at the next opportunity."]}, {"n": 137, "q": "Motorcycles are entitled to:", "a": "The same full lane width as other motor vehicles.", "expl": "Lane usage for the motorcyclist is critical. Motorcycles are entitled to the same full lane width as all other vehicles.", "choices": ["The same full lane width as other motor vehicles.", "Only half of a full lane.", "The shoulder instead of a travel lane.", "Any space between vehicles they can fit into."]}, {"n": 138, "q": "If your vehicle begins to skid, you should:", "a": "Turn your steering wheel in the direction you want to go.", "expl": "If your vehicle begins to skid, remain calm. Steer in the direction that you want to go and try not to overcorrect.", "choices": ["Brake hard immediately.", "Turn your steering wheel in the direction you want to go.", "Turn your steering wheel in the opposite direction.", "Accelerate and straighten the wheel."]}, {"n": 139, "q": "When approaching a flashing red traffic light, drivers should:", "a": "Treat the light like a stop sign.", "expl": "Flashing red lights are used at dangerous intersections. Treat them like stop signs.", "choices": ["Slow down and proceed without stopping.", "Treat the light like a yield sign only.", "Treat the light like a stop sign.", "Speed up before the light changes."]}, {"n": 140, "q": "When approaching a steady green traffic light, drivers should:", "a": "Continue driving, unless there are vehicles or pedestrians already in the", "expl": "intersection. When approaching an intersection with a steady green traffic light, yield to pedestrians in the crosswalk and vehicles still in the intersection. You may continue driving, but should approach the intersection at a speed that will allow you to slow down and stop if the light changes before you get there.", "choices": ["Continue driving, unless there are vehicles or pedestrians already in the", "Speed up to clear the intersection quickly.", "Stop before entering the intersection.", "Yield only to vehicles, not pedestrians."]}, {"n": 141, "q": "When approaching a traffic signal displaying a steady yellow arrow, drivers:", "a": "Should slow to a stop, if it is safe to do so.", "expl": "A steady yellow arrow indicates that a red arrow is about to appear. Stop unless you are already within the intersection.", "choices": ["Must speed up to complete the turn.", "Should slow to a stop, if it is safe to do so.", "Should ignore the arrow and wait for a green light.", "May turn immediately without slowing."]}, {"n": 142, "q": "When approaching a traffic signal displaying a steady green arrow, drivers:", "a": "May turn in the direction of the arrow after yielding to traffic and pedestrians already", "expl": "in the intersection. A green arrow displayed on a traffic signal tells drivers that they may turn in the direction of the arrow. You must be in the proper lane for such a turn. Yield the right-of-way to vehicles and pedestrians already in the intersection.", "choices": ["Must wait for a circular green light.", "May turn in the direction of the arrow after yielding to traffic and pedestrians already", "May turn only after the arrow turns yellow.", "Must come to a complete stop before turning."]}, {"n": 143, "q": "If a crossing guard is directing traffic in a school zone, you must:", "a": "Follow the directions given by the crossing guard.", "expl": "Be prepared to reduce your speed and use caution when directed to do so by a sign, crossing guard, or law enforcement officer. Always drive with extra caution in a school zone.", "choices": ["Ignore the guard if no children are visible.", "Follow the traffic signals instead.", "Drive around the school zone quickly.", "Follow the directions given by the crossing guard."]}, {"n": 144, "q": "An \"End school zone\" sign indicates:", "a": "The end of a reduced speed zone.", "expl": "Do not exceed the school zone speed limit during indicated times. The end of a reduced speed school zone will be indicated by an \"End school zone\" regulatory sign.", "choices": ["That you may park next to the curb.", "The end of a reduced speed zone.", "That children may cross anywhere ahead.", "That school buses may no longer stop."]}, {"n": 145, "q": "Downward-facing triangular signs:", "a": "Tell drivers to yield.", "expl": "Downward-facing triangular signs usually indicate that drivers should yield. Once the road is clear of traffic or pedestrians and it is safe to do so, drivers may proceed.", "choices": ["Warn of upcoming hazards.", "Mark school zones.", "Tell drivers to yield.", "Indicate no-passing zones."]}, {"n": 146, "q": "Crossbuck signs indicate:", "a": "Railroad crossings.", "expl": "Crossbuck signs tell drivers to yield to trains at a railroad crossing. Drivers should not try to outdrive a train.", "choices": ["Hospital zones.", "Railroad crossings.", "No-passing zones.", "School zones."]}, {"n": 147, "q": "At a four-way stop:", "a": "The driver to arrive first has the right-of-way.", "expl": "At four-way stops, traffic from all four directions must stop. The first vehicle to reach the intersection should move forward first. If two vehicles reach the intersection at the same time, the driver on the left yields to the driver on the right.", "choices": ["The largest vehicle goes first.", "The driver to arrive first has the right-of-way.", "The driver on the left goes first.", "Drivers going straight always go first."]}, {"n": 148, "q": "When passing a row of parked vehicles, you should:", "a": "Be prepared for a person or vehicle to unexpectedly enter your lane.", "expl": "Keep a space between your vehicle and parked vehicles. A person may step out of a parked vehicle or out from between the parked vehicles without looking. A driver may begin moving their vehicle before realizing you are there.", "choices": ["Be prepared for a person or vehicle to unexpectedly enter your lane.", "Drive as close to the parked cars as possible.", "Speed up to get past them quickly.", "Assume no one will enter your lane."]}, {"n": 149, "q": "If you need to stop quickly and your vehicle is not equipped with an Anti-Lock Braking System (ABS), you should:", "a": "Firmly pump your brakes.", "expl": "Pumping the brakes is generally the best way to stop a car in an emergency. The car will stop quickly and you will also be able to continue steering.", "choices": ["Firmly pump your brakes.", "Pump the accelerator instead.", "Turn the steering wheel sharply while braking.", "Press and hold the brake pedal firmly."]}, {"n": 150, "q": "A regulatory sign containing a red circle with a slash through the middle indicates:", "a": "That an action is forbidden.", "expl": "Some regulatory signs prohibit certain actions. These signs are rectangular and white with red and black markings. A red circle and slash on top of a black symbol indicates that the specified action is forbidden. U.S Traffic Signs Yield Drivers must slow down and be prepared to stop, yielding the right-of-way to any pedestrians and cross traffic. Do Not Enter Drivers are approaching one-way traffic from the wrong direction and should turn around immediately. Wrong Way Drivers are approaching one-way traffic from the wrong direction and should turn around immediately. Do Not Pass Passing is unsafe and prohibited in the indicated area. Pass with Care Drivers may pass when it is safe to do so. Keep Right Drivers are approaching an obstruction and should keep to the right. Keep Right Drivers are approaching an obstruction and should keep to the right. No Bicycles No bicycles are allowed in the indicated area. No Pedestrians No pedestrians are allowed in the indicated area. No Trucks The indicated area is not suitable for use by large trucks. No Left Turn Drivers may not perform a left turn at the indicated intersection. No Right Turn Drivers may not perform a right turn at the indicated intersection. No U-Turn Drivers may not perform a U-turn at the indicated location. No Parking Parking is prohibited at any location where this sign is posted. No Parking Parking is prohibited at any location where this sign is posted. Limited Parking Parking is restricted in the indicated location during the posted hours. Pay Parking Drivers may park in the indicated location if they pay the required fees and do not exceed the time limit. Right Turn Only Traffic in the indicated lane must turn right at the intersection. Left Turn Only Traffic in the indicated lane must turn left at the intersection. Straight Only Traffic in the indicated lane must continue straight through the intersection. Straight or Turn Traffic in the indicated lane may continue straight or turn in the direction of the arrow. U-Turn Only Traffic in the indicated lane must complete a U-turn. Left Lane Must Turn Left Drivers in the left lane must turn left at the indicated intersection. Multiple Railroad Tracks The roadway intersects with a railroad crossing with multiple tracks. Drivers must be sure all tracks are clear before proceeding. Maximum Speed Limit This is the maximum speed at which drivers may travel. Drivers must drive at a lower speed if conditions require it. Maximum and Minimum Speed Limits Under ideal conditions, drivers may not exceed the maximum posted speed and may not drive slower than the minimum posted speed. School Zone Speed Limit During the posted times, or when a warning light is flashing, drivers must follow a school zone's speed limit. End School Zone A school zone and its restricted speed limit come to an end. One-Way Traffic Traffic on the roadway moves only in the direction indicated by the arrow. One-Way Traffic Traffic on the roadway moves only in the direction indicated by the arrow. No Turn on Red Drivers may not make a right or left turn when the traffic signal is red. Left Turn Yield on Green Drivers may make a left turn when the traffic signal is green, but they must first yield to pedestrians and oncoming traffic. Speeding Fines Doubled Fines for moving traffic violations are doubled in the indicated area. This sign is commonly posted in work and school zones. Slower Traffic Keep Right Slower-moving traffic should stay in the right lane. The left lane is reserved for faster-moving vehicles to pass slower-moving traffic. Two-Way Left Turn Traffic from both directions may use the shared center lane to turn left. Slow-Moving Vehicle A vehicle with a reflective orange and red triangle on its rear is a slow- moving vehicle that often travels at speeds slower than 25 mph. Roundabout Traffic ahead moves in a counterclockwise direction. Drivers should enter at a low speed and yield to traffic already using the circle. Reserved Handicap Parking Indicated parking spaces are reserved for vehicles with the proper license plate or hanging tag registered to a person in the vehicle. Bicycle Lane The lane is reserved for bicyclists. Passenger vehicles may only enter a bicycle lane when turning. High Occupancy Vehicle Lane The lane is reserved during the posted times for vehicles with the indicated number of occupants. Restricted Lane Ends Prior lane restrictions come to an end. Stop Drivers must come to a complete stop and yield the right-of-way to pedestrians and cross traffic. All-Way Stop Drivers from all directions must come to a complete stop and take turns entering the intersection. Drivers must yield to any pedestrians. Stop Here on Red At a stop sign or red traffic signal, drivers must come to a complete stop at the indicated stop line. Divided Highway Drivers are entering a divided highway and should keep to the right of the median. U.S Warning Signs Sharp Turn to the Left Drivers should reduce their speed and prepare to turn sharply to the left. Sharp Turn to the Right Drivers should reduce their speed and prepare to turn sharply to the right. Curve to the Left Drivers should reduce their speed and prepare for the road to curve to the left. Curve to the Right Drivers should reduce their speed and prepare for the road to curve to the right. Reverse Turn The road ahead turns sharply in one direction and then in the other. Drivers should reduce their speed. Reverse Curve The road ahead curves in one direction and then in the other. Drivers should reduce their speed. Winding Road The road ahead winds in a series of curves. Drivers should reduce their speed. Directional Arrow Drivers should reduce their speed and prepare to turn sharply in the direction indicated by the arrow. Chevron Drivers should reduce their speed and prepare to turn sharply in the direction indicated by the chevron. Road Narrows The road ahead narrows. Drivers should take care to stay on the traveled portion of the roadway. Merging Traffic Drivers should be alert to traffic merging from the right and should make room for merging vehicles. Added Lane The road ahead comes together with another road. Drivers do not have to merge but should be aware of additional traffic. Farm Machinery The roadway is shared with farm machinery affic. Side Road The road meets an intersecting side road ahead. Drivers should be alert to entering traffic. Y Intersection Drivers are approaching a fork in the road. They should prepare to slow down or stop before turning left or right. Pavement Ends The road surface ahead changes from pavement to gravel or dirt and tires will have less traction. Pavement Ends The road surface ahead changes from pavement to gravel or dirt and tires will have less traction. Traffic Island There is a traffic island on the roadway and drivers may travel on either side of the obstruction. Divided Highway Ahead A divided highway begins ahead. Drivers should keep to the right of the median. Divided Highway Ends The divided highway ends ahead. Drivers should keep to the right and be alert to oncoming traffic. Two-Way Traffic Lanes travel in two different directions. Drivers should keep to the right and be alert to oncoming traffic. Exit Speed Limit Drivers should slow to the posted speed limit once they have entered the freeway's deceleration lane. Reduced Speed Ahead The speed limit is reduced on the roadway ahead. Drivers should begin to slow down. Advisory Speed An upcoming curve or turn in the road requires a decreased speed. Travel may resume at the normal speed limit after the turn is completed. Low Shoulder The shoulder ahead is lower than the main-traveled portion of the road. Drivers should expect a drop if they leave the roadway. Low Clearance An overhead structure may be too low for certain vehicles to safely continue on the roadway. Downhill Slope The road ahead slopes at a steep grade. Drivers should increase their following distance and decrease their speed. Fallen Rock There may be large fallen rocks on the road surface. Drivers should be alert and prepared to safely maneuver around the obstacles. Drawbridge The bridge ahead is a drawbridge. Drivers should slow to a stop when told to do so by a sign, signal, or flagger. Ice on Bridges Bridges freeze more quickly than the rest of the road. Drivers should use caution when driving on bridges under wet or freezing conditions. Narrow Bridge The bridge ahead is more narrow than the preceeding roadway. Drivers should use caution when driving on a narrow bridge. One-Lane Bridge The bridge ahead has only one traffic lane. Drivers should be prepared to yield to oncoming traffic. Bump There is a sudden bump on the road ahead. Drivers should slow down to avoid losing control of their vehicle. Dip There is a sudden dip in the road ahead. Drivers should slow down to avoid losing control of their vehicle. Grooved Pavement The road surface has been grooved to improve traction under slippery conditions. Cyclists should use caution. Dead End The road ahead comes to an end. Drivers will have to turn around to leave the ending roadway. School Zone Drivers are in a school zone and must be alert to children and pedestrians. Drivers should reduce their speed. School Crossing Drivers are approaching a school crossing and must be alert to children and pedestrians. Drivers should reduce their speed. Playground Area Drivers are near a playground and should be extra alert to children on or near the roadway. Railroad Crossing The roadway intersects with railroad tracks. Drivers must yield to all trains and proceed only when it is safe to do so. Railroad Crossing The roadway intersects with railroad tracks. Drivers must yield to all trains and proceed only when it is safe to do so. Railroad Crossing The roadway intersects with railroad tracks. Drivers must yield to all trains and proceed only when it is safe to do so. Railroad Crossing The roadway intersects with railroad tracks. Drivers must yield to all trains and proceed only when it is safe to do so. Uneven Grade Crossing The roadway intersects with railroad tracks on an uneven grade. Vehicles with low undercarriages may have difficulty crossing the tracks. Roadwork Ahead A work zone is ahead on the roadway. Drivers should proceed with caution and follow all d off the highway in the direction of the arrow. Emergency Notification If there is an urgent safety issue at a railroad crossing, drivers should call the number on the service sign for assistance. Handicap-Accessible The indicated location is designed to be handicap-accessible. Evacuation Route Drivers are on a roadway that should be used during an evacuation due to a hurricane or other emergency. Bus Station There is a bus station at the location indicated on the sign. Park There is a park at the location indicated on the recreation sign. Playground There is a playground at the location indicated on the recreation sign. Wildlife Viewing Area The location indicated on the recreation sign has a wildlife viewing area available for drivers leaving the highway. Wildlife Viewing Area The location indicated on the recreation sign has a wildlife viewing area available for drivers leaving the highway. State Park There is a state park at the location indicated on the recreation sign. Boat Ramp There is a boat ramp available at the location indicated on the recreation sign. Canoe Ramp There is a canoe ramp available at the location indicated on the recreation sign. Historical Marker There is an area of historical significance at the location indicated on the recreation sign. Winter Recreational Area The location indicated on the recreation sign has a winter recreational area available for drivers leaving the highway. Ski Area The location indicated on the recreation sign has a ski area available for drivers leaving the highway. Milepost The number on a milepost indicates a location on the highway. Mileposts often correlate with exit numbers. Destination Sign Distances to the listed locations are posted in miles on the right side of the sign. Guide Sign Drivers are approaching upcoming exits and should merge into the necessary lanes. Guide Sign Drivers can access the posted route by driving in the indicated lane. Exit There is a highway exit in the direction of the arrow. Drivers who wish to leave the roadway may signal and merge onto the off-ramp. Trolley Station There is a trolley station at the location indicated on the sign. Airport There is an airport at the location indicated on the sign. Bike Route There is a bike route in the direction of the arrow. Drivers should be alert to bicyclists. Hiking Trail There is a hiking trail in the direction of the arrow. Drivers should be alert to pedestrians. Parking A parking lot is available at the indicated location. Practice Test https://www.dmv-written-test.com/north-carolina/practice-test-1.html", "choices": ["That an action is forbidden.", "That a hazard is ahead.", "That an action is required.", "That the road is closed ahead."]}];
const STORE = 'lilly-nc-dmv-v2';
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || { misses:{}, known:{} }; }
  catch(e) { return { misses:{}, known:{} }; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
(function migrate(){
  try {
    const old = JSON.parse(localStorage.getItem('lilly-nc-dmv-v1')||'null');
    if (old && old.misses) {
      const s = load();
      s.misses = Object.assign({}, old.misses, s.misses||{});
      localStorage.setItem(STORE, JSON.stringify(s));
    }
  } catch(e) {}
})();

let state = load();
let screen = 'home';
let mode = 'flash';
let filter = 'all';
let deck = [];
let i = 0;
let revealed = false;
let locked = false;
let gameScore = { right:0, wrong:0 };
let lastFeedback = '';

const scrollEl = document.getElementById('scroll');
const dockEl = document.getElementById('dock');
const topNav = document.getElementById('topNav');
const subNav = document.getElementById('subNav');
const barWrap = document.getElementById('barWrap');

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function missCount() { return Object.keys(state.misses||{}).length; }
function setActive(el, on) { el.classList.toggle('active', !!on); }
function setDock(html) {
  if (!html) { dockEl.classList.remove('show'); dockEl.innerHTML=''; return; }
  dockEl.innerHTML = html;
  dockEl.classList.add('show');
}

function buildDeck() {
  if (filter === 'miss') deck = CARDS.filter(c => state.misses[c.n]);
  else deck = CARDS.slice();
  for (let k=deck.length-1;k>0;k--) {
    const j = Math.floor(Math.random()*(k+1));
    [deck[k], deck[j]] = [deck[j], deck[k]];
  }
  i = 0; revealed = false; locked = false; lastFeedback='';
  if (mode === 'game') gameScore = { right:0, wrong:0 };
  render();
}

function goHome() {
  screen = 'home';
  topNav.hidden = true; subNav.hidden = true; barWrap.hidden = true;
  setDock('');
  render();
}
function startStudy(m) {
  screen = 'study'; mode = m; filter = 'all';
  topNav.hidden = false; subNav.hidden = false; barWrap.hidden = false;
  setActive(tabFlash, mode==='flash'); setActive(tabGame, mode==='game');
  setActive(filterAll, true); setActive(filterMiss, false);
  buildDeck();
}

function updateChrome() {
  document.getElementById('filterMiss').textContent = 'Missed (' + missCount() + ')';
  const total = deck.length || 1;
  document.getElementById('prog').style.width = Math.min(100, Math.round((i/total)*100)) + '%';
}

function renderHome() {
  setDock('');
  scrollEl.innerHTML = `
    <div class="home">
      <button class="big" id="goFlash" type="button">
        <strong>Flashcards</strong>
        <span>See the question, flip for the answer, mark Got it or Missed.</span>
      </button>
      <button class="big" id="goGame" type="button">
        <strong>Game</strong>
        <span>Multiple choice. Pick an answer. Misses are saved so you can drill them.</span>
      </button>
      <p class="scoreline">Missed saved on this phone: <b>${missCount()}</b></p>
    </div>`;
  document.getElementById('goFlash').onclick = () => startStudy('flash');
  document.getElementById('goGame').onclick = () => startStudy('game');
}

function renderDone() {
  const still = missCount();
  setDock(`<button class="primary" id="again" type="button">Shuffle again</button>`);
  scrollEl.innerHTML = `
    <button class="back" id="backHome" type="button">← Home</button>
    <div class="empty">
      <p><b>Round done.</b></p>
      ${mode==='game' ? `<p>Score: ${gameScore.right} right · ${gameScore.wrong} wrong</p>` : ''}
      <p>${still ? still + ' still marked missed.' : 'No misses on the board.'}</p>
      ${still ? `<p style="margin-top:12px"><button class="primary" id="toMiss" type="button" style="background:#6b4eff">Focus on misses</button></p>` : ''}
      <p style="margin-top:8px"><button class="ghost" id="switchMode" type="button">${mode==='flash'?'Switch to Game':'Switch to Flashcards'}</button></p>
    </div>`;
  document.getElementById('backHome').onclick = goHome;
  document.getElementById('again').onclick = () => buildDeck();
  const tm = document.getElementById('toMiss');
  if (tm) tm.onclick = () => { filter='miss'; setActive(filterAll,false); setActive(filterMiss,true); buildDeck(); };
  document.getElementById('switchMode').onclick = () => startStudy(mode==='flash'?'game':'flash');
}

function renderFlash(c) {
  scrollEl.innerHTML = `
    <button class="back" id="backHome" type="button">← Home</button>
    <div class="stats">
      <span>Left: <b>${Math.max(deck.length-i,0)}</b></span>
      <span>Missed: <b>${missCount()}</b></span>
    </div>
    <div class="card question">
      <div class="qnum">Question ${c.n} · Flashcards</div>
      <div class="q">${esc(c.q)}</div>
      ${revealed ? `<div class="ans"><b>Answer:</b> ${esc(c.a)}</div><div class="expl">${esc(c.expl||'')}</div>` : ''}
    </div>`;
  document.getElementById('backHome').onclick = goHome;
  if (!revealed) {
    setDock(`<button class="primary" id="reveal" type="button">Show answer</button>`);
    document.getElementById('reveal').onclick = () => { revealed = true; render(); };
  } else {
    setDock(`<div class="actions"><button class="know" id="know" type="button">Got it</button><button class="miss" id="miss" type="button">Missed</button></div>`);
    document.getElementById('know').onclick = () => {
      delete state.misses[c.n]; state.known[c.n]=true; save();
      i++; revealed=false; render();
    };
    document.getElementById('miss').onclick = () => {
      state.misses[c.n]=true; delete state.known[c.n]; save();
      i++; revealed=false; render();
    };
  }
}

function renderGame(c) {
  const choices = (c.choices||[c.a]).slice();
  scrollEl.innerHTML = `
    <button class="back" id="backHome" type="button">← Home</button>
    <div class="stats">
      <span>Q ${i+1}/${deck.length}</span>
      <span>Score: <b>${gameScore.right}</b> / ${gameScore.right+gameScore.wrong}</span>
      <span>Missed: <b>${missCount()}</b></span>
    </div>
    <div class="card question">
      <div class="qnum">Question ${c.n} · Game</div>
      <div class="q">${esc(c.q)}</div>
    </div>
    <div class="choices" id="choices">
      ${choices.map((ch,idx)=>`<button class="choice" type="button" data-i="${idx}" data-ans="${esc(ch)}"><span class="letter">${'ABCD'[idx]}</span><span class="txt">${esc(ch)}</span></button>`).join('')}
    </div>
    ${lastFeedback ? `<div class="expl" style="margin-top:8px">${lastFeedback}</div>` : ''}`;
  document.getElementById('backHome').onclick = goHome;

  if (!locked) {
    setDock(`<p class="hint">Pick an answer</p>`);
    [...document.querySelectorAll('.choice')].forEach(btn => {
      btn.onclick = () => {
        if (locked) return;
        locked = true;
        const pick = btn.getAttribute('data-ans');
        const ok = pick === c.a;
        [...document.querySelectorAll('.choice')].forEach(b => {
          b.disabled = true;
          const ans = b.getAttribute('data-ans');
          if (ans === c.a) b.classList.add('correct');
          else if (b === btn && !ok) b.classList.add('wrong');
        });
        if (ok) {
          gameScore.right++;
          delete state.misses[c.n]; state.known[c.n]=true;
          lastFeedback = 'Nice.';
        } else {
          gameScore.wrong++;
          state.misses[c.n]=true; delete state.known[c.n];
          lastFeedback = 'Correct: <b style="color:#b8f0d0">'+esc(c.a)+'</b>' + (c.expl ? '<br/>'+esc(c.expl) : '');
        }
        save();
        // show feedback in scroll + Next always in dock
        const expl = document.createElement('div');
        expl.className = 'expl';
        expl.style.marginTop = '8px';
        expl.innerHTML = lastFeedback;
        scrollEl.appendChild(expl);
        setDock(`<button class="primary" id="next" type="button">Next</button>`);
        document.getElementById('next').onclick = () => {
          i++; locked=false; revealed=false; lastFeedback='';
          scrollEl.scrollTop = 0;
          render();
        };
      };
    });
  } else {
    // already answered (re-render path)
    [...document.querySelectorAll('.choice')].forEach(b => {
      b.disabled = true;
      if (b.getAttribute('data-ans') === c.a) b.classList.add('correct');
    });
    setDock(`<button class="primary" id="next" type="button">Next</button>`);
    document.getElementById('next').onclick = () => {
      i++; locked=false; revealed=false; lastFeedback='';
      scrollEl.scrollTop = 0; render();
    };
  }
}

function render() {
  if (screen === 'home') { renderHome(); return; }
  updateChrome();
  if (!deck.length) {
    setDock('');
    scrollEl.innerHTML = `
      <button class="back" id="backHome" type="button">← Home</button>
      <div class="empty">${filter==='miss'
        ? 'No missed cards yet. Play a round and miss a few, then come back here.'
        : 'Deck empty.'}</div>`;
    document.getElementById('backHome').onclick = goHome;
    return;
  }
  if (i >= deck.length) { renderDone(); return; }
  const c = deck[i];
  if (mode === 'flash') renderFlash(c);
  else renderGame(c);
}

const tabFlash = document.getElementById('tabFlash');
const tabGame = document.getElementById('tabGame');
const filterAll = document.getElementById('filterAll');
const filterMiss = document.getElementById('filterMiss');
tabFlash.onclick = () => { if (mode!=='flash') startStudy('flash'); };
tabGame.onclick = () => { if (mode!=='game') startStudy('game'); };
filterAll.onclick = () => { filter='all'; setActive(filterAll,true); setActive(filterMiss,false); buildDeck(); };
filterMiss.onclick = () => { filter='miss'; setActive(filterAll,false); setActive(filterMiss,true); buildDeck(); };
document.getElementById('clearMiss').onclick = () => {
  if (!confirm('Clear all missed marks on this phone?')) return;
  state = { misses:{}, known:{} }; save(); buildDeck();
};

goHome();
</script>
