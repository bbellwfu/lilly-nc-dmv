ble for drivers leaving the highway. Diesel may also be available. Diesel The exit indicated on the service sign has diesel fuel service options available for drivers leaving the highway. Camping The exit indicated on the service sign has camping locations available for drivers leaving the highway. Telephone The location indicated on the service sign has a telephone available for public use. Litter Barrel The location indicated on the service sign has a litter barrel available for public use. Hospital There is a hospital at the location indicated on the service sign. Rest Area A rest area is located off the highway in the direction of the arrow. Emergency Notification If there is an urgent safety issue at a railroad crossing, drivers should call the number on the service sign for assistance. Handicap-Accessible The indicated location is designed to be handicap-accessible. Evacuation Route Drivers are on a roadway that should be used during an evacuation due to a hurricane or other emergency. Bus Station There is a bus station at the location indicated on the sign. Park There is a park at the location indicated on the recreation sign. Playground There is a playground at the location indicated on the recreation sign. Wildlife Viewing Area The location indicated on the recreation sign has a wildlife viewing area available for drivers leaving the highway. Wildlife Viewing Area The location indicated on the recreation sign has a wildlife viewing area available for drivers leaving the highway. State Park There is a state park at the location indicated on the recreation sign. Boat Ramp There is a boat ramp available at the location indicated on the recreation sign. Canoe Ramp There is a canoe ramp available at the location indicated on the recreation sign. Historical Marker There is an area of historical significance at the location indicated on the recreation sign. Winter Recreational Area The location indicated on the recreation sign has a winter recreational area available for drivers leaving the highway. Ski Area The location indicated on the recreation sign has a ski area available for drivers leaving the highway. Milepost The number on a milepost indicates a location on the highway. Mileposts often correlate with exit numbers. Destination Sign Distances to the listed locations are posted in miles on the right side of the sign. Guide Sign Drivers are approaching upcoming exits and should merge into the necessary lanes. Guide Sign Drivers can access the posted route by driving in the indicated lane. Exit There is a highway exit in the direction of the arrow. Drivers who wish to leave the roadway may signal and merge onto the off-ramp. Trolley Station There is a trolley station at the location indicated on the sign. Airport There is an airport at the location indicated on the sign. Bike Route There is a bike route in the direction of the arrow. Drivers should be alert to bicyclists. Hiking Trail There is a hiking trail in the direction of the arrow. Drivers should be alert to pedestrians. Parking A parking lot is available at the indicated location. Practice Test https://www.dmv-written-test.com/north-carolina/practice-test-1.html", "choices": ["Come to a complete stop", "That an action is forbidden.", "Yield and continue", "Slow down and proceed with caution"]}];
const STORE = 'lilly-nc-dmv-v2';
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || { misses:{}, known:{} }; }
  catch(e) { return { misses:{}, known:{} }; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
(function migrate(){
  try {
    const old = JSON.parse(localStorage.getItem('lilly-nc-dmv-v1')||'null');
    if (old && old.misses) {
      const s = load();
      s.misses = Object.assign({}, old.misses, s.misses||{});
      localStorage.setItem(STORE, JSON.stringify(s));
    }
  } catch(e) {}
})();

let state = load();
let screen = 'home';
let mode = 'flash';
let filter = 'all';
let deck = [];
let i = 0;
let revealed = false;
let locked = false;
let gameScore = { right:0, wrong:0 };
let lastFeedback = '';

const scrollEl = document.getElementById('scroll');
const dockEl = document.getElementById('dock');
const topNav = document.getElementById('topNav');
const subNav = document.getElementById('subNav');
const barWrap = document.getElementById('barWrap');

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function missCount() { return Object.keys(state.misses||{}).length; }
function setActive(el, on) { el.classList.toggle('active', !!on); }
function setDock(html) {
  if (!html) { dockEl.classList.remove('show'); dockEl.innerHTML=''; return; }
  dockEl.innerHTML = html;
  dockEl.classList.add('show');
}

function buildDeck() {
  if (filter === 'miss') deck = CARDS.filter(c => state.misses[c.n]);
  else deck = CARDS.slice();
  for (let k=deck.length-1;k>0;k--) {
    const j = Math.floor(Math.random()*(k+1));
    [deck[k], deck[j]] = [deck[j], deck[k]];
  }
  i = 0; revealed = false; locked = false; lastFeedback='';
  if (mode === 'game') gameScore = { right:0, wrong:0 };
  render();
}

function goHome() {
  screen = 'home';
  topNav.hidden = true; subNav.hidden = true; barWrap.hidden = true;
  setDock('');
  render();
}
function startStudy(m) {
  screen = 'study'; mode = m; filter = 'all';
  topNav.hidden = false; subNav.hidden = false; barWrap.hidden = false;
  setActive(tabFlash, mode==='flash'); setActive(tabGame, mode==='game');
  setActive(filterAll, true); setActive(filterMiss, false);
  buildDeck();
}

function updateChrome() {
  document.getElementById('filterMiss').textContent = 'Missed (' + missCount() + ')';
  const total = deck.length || 1;
  document.getElementById('prog').style.width = Math.min(100, Math.round((i/total)*100)) + '%';
}

function renderHome() {
  setDock('');
  scrollEl.innerHTML = `
    <div class="home">
      <button class="big" id="goFlash" type="button">
        <strong>Flashcards</strong>
        <span>See the question, flip for the answer, mark Got it or Missed.</span>
      </button>
      <button class="big" id="goGame" type="button">
        <strong>Game</strong>
        <span>Multiple choice. Pick an answer. Misses are saved so you can drill them.</span>
      </button>
      <p class="scoreline">Missed saved on this phone: <b>${missCount()}</b></p>
    </div>`;
  document.getElementById('goFlash').onclick = () => startStudy('flash');
  document.getElementById('goGame').onclick = () => startStudy('game');
}

function renderDone() {
  const still = missCount();
  setDock(`<button class="primary" id="again" type="button">Shuffle again</button>`);
  scrollEl.innerHTML = `
    <button class="back" id="backHome" type="button">← Home</button>
    <div class="empty">
      <p><b>Round done.</b></p>
      ${mode==='game' ? `<p>Score: ${gameScore.right} right · ${gameScore.wrong} wrong</p>` : ''}
      <p>${still ? still + ' still marked missed.' : 'No misses on the board.'}</p>
      ${still ? `<p style="margin-top:12px"><button class="primary" id="toMiss" type="button" style="background:#6b4eff">Focus on misses</button></p>` : ''}
      <p style="margin-top:8px"><button class="ghost" id="switchMode" type="button">${mode==='flash'?'Switch to Game':'Switch to Flashcards'}</button></p>
    </div>`;
  document.getElementById('backHome').onclick = goHome;
  document.getElementById('again').onclick = () => buildDeck();
  const tm = document.getElementById('toMiss');
  if (tm) tm.onclick = () => { filter='miss'; setActive(filterAll,false); setActive(filterMiss,true); buildDeck(); };
  document.getElementById('switchMode').onclick = () => startStudy(mode==='flash'?'game':'flash');
}

function renderFlash(c) {
  scrollEl.innerHTML = `
    <button class="back" id="backHome" type="button">← Home</button>
    <div class="stats">
      <span>Left: <b>${Math.max(deck.length-i,0)}</b></span>
      <span>Missed: <b>${missCount()}</b></span>
    </div>
    <div class="card question">
      <div class="qnum">Question ${c.n} · Flashcards</div>
      <div class="q">${esc(c.q)}</div>
      ${revealed ? `<div class="ans"><b>Answer:</b> ${esc(c.a)}</div><div class="expl">${esc(c.expl||'')}</div>` : ''}
    </div>`;
  document.getElementById('backHome').onclick = goHome;
  if (!revealed) {
    setDock(`<button class="primary" id="reveal" type="button">Show answer</button>`);
    document.getElementById('reveal').onclick = () => { revealed = true; render(); };
  } else {
    setDock(`<div class="actions"><button class="know" id="know" type="button">Got it</button><button class="miss" id="miss" type="button">Missed</button></div>`);
    document.getElementById('know').onclick = () => {
      delete state.misses[c.n]; state.known[c.n]=true; save();
      i++; revealed=false; render();
    };
    document.getElementById('miss').onclick = () => {
      state.misses[c.n]=true; delete state.known[c.n]; save();
      i++; revealed=false; render();
    };
  }
}

function renderGame(c) {
  const choices = (c.choices||[c.a]).slice();
  scrollEl.innerHTML = `
    <button class="back" id="backHome" type="button">← Home</button>
    <div class="stats">
      <span>Q ${i+1}/${deck.length}</span>
      <span>Score: <b>${gameScore.right}</b> / ${gameScore.right+gameScore.wrong}</span>
      <span>Missed: <b>${missCount()}</b></span>
    </div>
    <div class="card question">
      <div class="qnum">Question ${c.n} · Game</div>
      <div class="q">${esc(c.q)}</div>
    </div>
    <div class="choices" id="choices">
      ${choices.map((ch,idx)=>`<button class="choice" type="button" data-i="${idx}" data-ans="${esc(ch)}"><span class="letter">${'ABCD'[idx]}</span><span class="txt">${esc(ch)}</span></button>`).join('')}
    </div>
    ${lastFeedback ? `<div class="expl" style="margin-top:8px">${lastFeedback}</div>` : ''}`;
  document.getElementById('backHome').onclick = goHome;

  if (!locked) {
    setDock(`<p class="hint">Pick an answer</p>`);
    [...document.querySelectorAll('.choice')].forEach(btn => {
      btn.onclick = () => {
        if (locked) return;
        locked = true;
        const pick = btn.getAttribute('data-ans');
        const ok = pick === c.a;
        [...document.querySelectorAll('.choice')].forEach(b => {
          b.disabled = true;
          const ans = b.getAttribute('data-ans');
          if (ans === c.a) b.classList.add('correct');
          else if (b === btn && !ok) b.classList.add('wrong');
        });
        if (ok) {
          gameScore.right++;
          delete state.misses[c.n]; state.known[c.n]=true;
          lastFeedback = 'Nice.';
        } else {
          gameScore.wrong++;
          state.misses[c.n]=true; delete state.known[c.n];
          lastFeedback = 'Correct: <b style="color:#b8f0d0">'+esc(c.a)+'</b>' + (c.expl ? '<br/>'+esc(c.expl) : '');
        }
        save();
        // show feedback in scroll + Next always in dock
        const expl = document.createElement('div');
        expl.className = 'expl';
        expl.style.marginTop = '8px';
        expl.innerHTML = lastFeedback;
        scrollEl.appendChild(expl);
        setDock(`<button class="primary" id="next" type="button">Next</button>`);
        document.getElementById('next').onclick = () => {
          i++; locked=false; revealed=false; lastFeedback='';
          scrollEl.scrollTop = 0;
          render();
        };
      };
    });
  } else {
    // already answered (re-render path)
    [...document.querySelectorAll('.choice')].forEach(b => {
      b.disabled = true;
      if (b.getAttribute('data-ans') === c.a) b.classList.add('correct');
    });
    setDock(`<button class="primary" id="next" type="button">Next</button>`);
    document.getElementById('next').onclick = () => {
      i++; locked=false; revealed=false; lastFeedback='';
      scrollEl.scrollTop = 0; render();
    };
  }
}

function render() {
  if (screen === 'home') { renderHome(); return; }
  updateChrome();
  if (!deck.length) {
    setDock('');
    scrollEl.innerHTML = `
      <button class="back" id="backHome" type="button">← Home</button>
      <div class="empty">${filter==='miss'
        ? 'No missed cards yet. Play a round and miss a few, then come back here.'
        : 'Deck empty.'}</div>`;
    document.getElementById('backHome').onclick = goHome;
    return;
  }
  if (i >= deck.length) { renderDone(); return; }
  const c = deck[i];
  if (mode === 'flash') renderFlash(c);
  else renderGame(c);
}

const tabFlash = document.getElementById('tabFlash');
const tabGame = document.getElementById('tabGame');
const filterAll = document.getElementById('filterAll');
const filterMiss = document.getElementById('filterMiss');
tabFlash.onclick = () => { if (mode!=='flash') startStudy('flash'); };
tabGame.onclick = () => { if (mode!=='game') startStudy('game'); };
filterAll.onclick = () => { filter='all'; setActive(filterAll,true); setActive(filterMiss,false); buildDeck(); };
filterMiss.onclick = () => { filter='miss'; setActive(filterAll,false); setActive(filterMiss,true); buildDeck(); };
document.getElementById('clearMiss').onclick = () => {
  if (!confirm('Clear all missed marks on this phone?')) return;
  state = { misses:{}, known:{} }; save(); buildDeck();
};

goHome();
</script>
</body>
</html>
